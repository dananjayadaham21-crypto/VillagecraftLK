server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/villagecraft}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, profile, email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:}
            client-secret: ${FACEBOOK_CLIENT_SECRET:}
            scope: public_profile, email
app:
  bootstrap-admin-key: ${BOOTSTRAP_ADMIN_KEY:}
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_DEVELOPMENT_SECRET_TO_A_RANDOM_32_BYTE_OR_LONGER_VALUE}
